# Weekly dependency updates, capped at 5 open pull requests in total
# (4 for npm + 1 for GitHub Actions). Minor and patch updates are grouped
# so they arrive as a single pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 4
    commit-message:
      prefix: deps
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
